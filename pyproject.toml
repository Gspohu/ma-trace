[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ma-trace"
version = "0.2.0"
description = "Traceur de randonnee qui route en privilegiant l'ombre"
requires-python = ">=3.10"

# routing only needs these two, they cover overpass, the elevation api and the
# forest geometry. Everything else stays optional
dependencies = [
    "requests>=2.28",
    "shapely>=2.0",
]

[project.optional-dependencies]
# reading a geofabrik pbf, needed to build an index and never to route from one.
# FileProcessor landed in pyosmium 4.0, the extract module leans on it
index = [
    "osmium>=4.0",
]

dev = [
    "pytest>=7.0",
]

[project.scripts]
ma-trace = "cli.generate:main"
ma-trace-index = "cli.build_index:main"

[tool.setuptools]
packages = ["core", "cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
